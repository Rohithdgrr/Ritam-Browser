# Ritam Browser CI — tests, then Windows installers (.msi + NSIS), then
# draft releases on tags.
#
# Honesty notes (AGENTS.md §6):
#   * engine-adjacent tests run under `cargo nextest`, never `cargo test`
#     (one V8 isolate per process);
#   * the pinned engine is SHA-256-verified before extraction (rule 4);
#   * the ui-contract gate runs on every push but is NON-BLOCKING until
#     Govinda's browser/ui/chrome.js adopts the contract §10 event names
#     and its C4 honesty line (tracked in PLAN.md) — its failure is shown,
#     not hidden;
#   * installers are unsigned (no code-signing certificate yet); that is
#     stated in the README release notes, not papered over.

name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # draft releases on v* tags

env:
  OBSCURA_URL: https://github.com/h4ckf0r0day/obscura/releases/download/v0.2.4/obscura-x86_64-windows.zip
  OBSCURA_SHA256: 8e5428bf8c101f1439c53a9dcb52d7d09bb22599206b49f6420028d93d01189b

jobs:
  test:
    name: tests (nextest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            crates/ritam-browser
            crates/ritam-store
      - uses: taiki-e/install-action@cargo-nextest
      - name: Fetch + verify pinned Obscura engine (AGENTS.md rule 4)
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "obscura.zip"
          Invoke-WebRequest -Uri $env:OBSCURA_URL -OutFile $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:OBSCURA_SHA256) {
            throw "engine sha256 mismatch: got $hash want $env:OBSCURA_SHA256"
          }
          Expand-Archive $zip -DestinationPath tools/obscura-bin -Force
          if (-not (Test-Path tools/obscura-bin/obscura.exe)) {
            throw "obscura.exe missing after extraction"
          }
          & tools/obscura-bin/obscura.exe --version
      - name: nextest - core (nav + engine, includes CLI-vs-CDP parity)
        run: cargo nextest run
        working-directory: crates/ritam-browser
      - name: nextest - store (Devi)
        run: cargo nextest run
        working-directory: crates/ritam-store
      - name: nextest - host
        run: cargo nextest run
        working-directory: src-tauri

  contract-gate:
    name: ui-contract gate (non-blocking until Govinda C2/C4)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node tests/ui-contract.test.mjs

  bundle:
    name: build .msi + NSIS
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Fetch + verify pinned engine, stage into bundle resources
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "obscura.zip"
          Invoke-WebRequest -Uri $env:OBSCURA_URL -OutFile $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:OBSCURA_SHA256) {
            throw "engine sha256 mismatch: got $hash want $env:OBSCURA_SHA256"
          }
          Expand-Archive $zip -DestinationPath src-tauri/resources/engine -Force
          if (-not (Test-Path src-tauri/resources/engine/obscura.exe)) {
            throw "obscura.exe missing after extraction"
          }
      - name: Install Tauri CLI (official prebuilt npm distribution)
        run: npm install -g @tauri-apps/cli@^2
      - name: cargo tauri build (msi + nsis)
        run: tauri build
        working-directory: src-tauri
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ github.sha }}
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
      - name: Draft GitHub release (v* tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
