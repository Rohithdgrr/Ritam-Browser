<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>New tab</title>
    <style>
      /* Serene Canvas tokens (DESIGN.md): this page is served from the app
         origin inside a content webview and has no script at all. */
      :root {
        --canvas: #faf9f5;
        --surface-1: #f4f2ec;
        --border: #e2ddd3;
        --ink: #1e2321;
        --ink-muted: #68706b;
        --primary: #4a6b5d;
        --radius: 16px;
        --font-ui: "Segoe UI", "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
        --font-editorial: "Newsreader", Georgia, "Times New Roman", serif;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--canvas);
        color: var(--ink);
        font-family: var(--font-ui);
        padding: 24px;
      }
      main {
        text-align: center;
        max-width: 42rem;
      }
      h1 {
        font-family: var(--font-editorial);
        font-weight: 500;
        font-size: clamp(1.75rem, 4vw, 2.5rem);
        margin: 0 0 0.5rem;
      }
      p {
        margin: 0.25rem 0;
        color: var(--ink-muted);
        line-height: 1.6;
      }
      .hint {
        display: inline-block;
        margin-top: 1.25rem;
        padding: 0.5rem 1rem;
        background: var(--surface-1);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        font-size: 0.875rem;
      }
      kbd {
        font: inherit;
        font-size: 0.8125rem;
        padding: 0.1rem 0.35rem;
        border: 1px solid var(--border);
        border-bottom-width: 2px;
        border-radius: 4px;
        background: var(--canvas);
        color: var(--primary);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>New tab</h1>
      <p>This page is part of Ritam Browser, served from the browser itself.</p>
      <p class="hint">
        Type an address or search in the toolbar above, or press
        <kbd>Ctrl</kbd>+<kbd>L</kbd> to focus it.
      </p>
    </main>
  </body>
</html>
