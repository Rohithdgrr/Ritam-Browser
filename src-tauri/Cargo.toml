[package]
name = "govind-browser"
version = "0.1.0"
description = "Govind Browser — a fast, calm, local-first browser (milestone 1: browser shell)"
authors = ["Govind Browser contributors"]
license = "MIT"
edition = "2021"

[lib]
# The `_lib` suffix keeps the library name distinct from the binary on Windows.
name = "govind_browser_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `unstable` enables the multi-webview API (Window::add_child) used by the
# browser core: one embedded webview per tab inside a single native window.
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-shell = "2"
tauri-plugin-log = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
log = "0.4"

[profile.release]
panic = "abort"
lto = true
opt-level = "s"   # optimize for size — Govind is meant to be lightweight
strip = true
codegen-units = 1
