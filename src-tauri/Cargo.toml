[package]
name = "ritam-browser"
version = "0.1.0"
description = "Ritam Browser - Cosmic truth and universal order"
edition = "2021"
license = "Proprietary"

[lib]
name = "ritam_browser_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
ritam-browser-core = { path = "../crates/ritam-browser" }
