[package]
name = "ritam-browser"
version = "0.1.0"
description = "Ritam Browser — a fast, calm, local-first browser (milestone 1: browser shell)"
authors = ["Ritam Browser contributors"]
license = "MIT"
edition = "2021"

[lib]
# The `_lib` suffix keeps the library name distinct from the binary on Windows.
name = "ritam_browser_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `unstable` enables the multi-webview API (Window::add_child) used by the
# browser core: one embedded webview per tab inside a single native window.
# `devtools` keeps the per-page DevTools available in release builds too.
tauri = { version = "2", features = ["unstable", "devtools"] }
tauri-plugin-shell = "2"
tauri-plugin-log = "2"
tauri-plugin-single-instance = "2"
# Native open/save dialogs for bookmark import/export (PRD P1).
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
log = "0.4"
adblock = { version = "0.13.5", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling", "css-validation"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
base64 = "0.22"
# Safari keeps bookmarks in a plist; only read on macOS, parsed in tests anywhere.
plist = "1"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_UI_Shell"] }

[profile.release]
panic = "abort"
lto = true
opt-level = "s"   # optimize for size — Govind is meant to be lightweight
strip = true
codegen-units = 1
